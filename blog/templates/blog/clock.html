{% extends "blog/base.html" %}
{% load static %}
{% block title %}Часы{% endblock title %}
{% block content %}
    <h1>Виджет часов</h1>
    <div class="toolbar">
        <button type="button"
            class="button"
            hx-get="{% url 'clock_fragment' %}"
            hx-target="#clock"
            hx-swap="innerHTML"
            hx-trigger="every 1s"
            >Обновить время</button>
    </div>
    <div id="clock" class="clock">
        {% partialdef clock inline %}
            <span>{{ now|time:"H:i:s"}}</span>
        {% endpartialdef%}
    </div>
{% endblock content %}
